<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mall district bus-stop seating</title><style>body{margin:0;background:#263b3c;color:#fff;font:13px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:fixed;top:14px;left:14px;background:#17322eec;padding:12px 16px;border-radius:7px;max-width:370px}header strong,header small{display:block}header small{margin-top:5px;color:#d1dacb}nav{position:fixed;bottom:14px;left:14px;display:flex;flex-wrap:wrap;gap:6px}button{background:#173c35;color:#fce8b1;border:1px solid #cdd2bf;padding:12px;border-radius:5px}</style><canvas aria-label="Bus-stop seating review"></canvas><header><strong id="title"></strong><small id="source"></small><p id="status">Choose Sit to try the bench. It stays seated until Stand up.</p></header><nav><button id="mall">Mall-front shelter</button><button id="opposite">Opposite shelters & taxis</button><button id="spanner">Spanner stop</button><button id="sit">Sit</button><button id="wide">Wide view</button></nav><script type="module">
import * as T from '/game/three.module.js';import {createMallBusStop} from '/game/mall-bus-stops.js';import {MALL_BUS_STOPS,BUS_STOP_SEATS,busStopPeople,stopLocal,stopPoint} from '/game/mall-bus-stops-data.js';import {createActor} from '/game/human-character.js';import {createVehicle} from '/game/accra-vehicles.js';import {cityEnvironment,enhanceMaterials} from '/game/graphics-materials.js';import {disposeScene} from '/game/render-utils.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;const scene=new T.Scene();scene.background=new T.Color('#c1d2d4');scene.environment=cityEnvironment();const sun=new T.DirectionalLight('#fff1d8',2.5);sun.position.set(-12,24,18);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22});sun.shadow.bias=-.001;scene.add(sun,new T.HemisphereLight('#e9f2fa','#797c65',1.8));const floor=new T.Mesh(new T.PlaneGeometry(150,150),new T.MeshStandardMaterial({color:'#a4a99c',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;floor.receiveShadow=true;scene.add(floor);const road=new T.Mesh(new T.PlaneGeometry(150,8),new T.MeshStandardMaterial({color:'#343a3c',roughness:.97}));road.rotation.x=-Math.PI/2;road.position.set(0,0,8.5);road.receiveShadow=true;scene.add(road);const camera=new T.PerspectiveCamera(48,1,.1,500),root=new T.Group(),self=createActor('👨🏾','stop-review-player'),npc=new Map(),car=createVehicle('taxi',0xc3c6c7);scene.add(root,self.group,car.group);let stop,acting=false,model;

document.getElementById('mall').onclick=()=>choose(1);document.getElementById('opposite').onclick=()=>choose(2);document.getElementById('spanner').onclick=()=>choose(0);document.getElementById('wide').onclick=()=>view(true);document.getElementById('sit').onclick=()=>{acting=!acting;document.getElementById('sit').textContent=acting?'Stand up':'Sit';document.getElementById('status').textContent=acting?'Seated · remains seated until you choose Stand up':'Standing · the route in front of the bench is clear';};
let last=0;function frame(ms){const t=ms/1000,dt=Math.min(.04,last?t-last:0);last=t;const seat=BUS_STOP_SEATS.find(s=>s.stopId===stop.id),p=stopLocal(stop,acting?seat.seatPosition:seat.position);self.group.position.set(p[0],acting?seat.offset:0,p[1]);self.group.rotation.y=Math.PI;self.animate(t,false,{action:acting?'sit':null,speed:0});self.group.position.y+=acting?seat.offset:0;for(const a of npc.values())a.group.visible=false;for(const p of busStopPeople(stop,t)){let a=npc.get(p.id);if(!a){a=createActor(p.avatar,p.id);npc.set(p.id,a);scene.add(a.group)}const q=stopLocal(stop,p.position);a.group.visible=true;a.group.position.set(q[0],0,q[1]);a.group.rotation.y=p.moving?(p.heading-stop.heading)*-Math.PI/180+Math.PI:Math.PI;a.animate(t,p.moving,{speed:p.speed,action:p.action});a.group.position.y+=p.poseOffset||0;}car.group.position.set((t*8)%100-50,0,8.5);car.group.rotation.y=-Math.PI/2;car.animateVehicle({distance:dt*8},dt);renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
