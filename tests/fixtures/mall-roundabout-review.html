<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accra Mall roundabout · Worldfolk review</title><style>body{margin:0;background:#b5ceda;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}header,nav{position:fixed;background:#fffef2ed;padding:12px 16px;border-radius:12px;z-index:2}header{top:12px;left:12px}h1{font-size:18px;margin:0 0 4px}nav{bottom:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap}button{padding:12px;border:0;border-radius:8px;background:#183e36;color:white}</style><canvas></canvas><header><h1>Accra Mall roundabout and approaches</h1><output>Mapped roads · grass island · Spanner pedestrian route</output></header><nav><button id="overview">Overview</button><button id="approach">Pedestrian approach</button><button id="monument">Statue & fountain</button><button id="circle">Drive the circle</button><button id="night">Day / night</button></nav><script type="module">
import * as T from '/game/three.module.js';import {createMallRoundabout} from '/game/mall-roundabout.js';import {MALL_CIRCLE,MALL_ROUNDABOUT,ROUNDABOUT_ARRIVAL,roundaboutLocal} from '/game/mall-roundabout-data.js';import {createSpanner} from '/game/spanner.js';import {SPANNER} from '/game/spanner-data.js';import {createAccraMall} from '/game/accra-mall.js';import {POPULAR_LANDMARKS} from '/game/popular-landmarks-data.js';import {createVehicle} from '/game/accra-vehicles.js';import {createActor} from '/game/human-character.js';import {createPrecinctLife} from '/game/precinct-life.js';import {makeRoadPath} from '/game/traffic-routing.js';import {cityEnvironment} from '/game/graphics-materials.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color('#b4cfdc');scene.environment=cityEnvironment();const roundabout=createMallRoundabout();scene.add(roundabout.group);const sun=new T.DirectionalLight('#ffedcd',2.5);sun.position.set(-150,250,80);const light=new T.HemisphereLight('#e8f4ff','#706a56',1.6);scene.add(sun,light);const base=new T.Mesh(new T.PlaneGeometry(900,900),new T.MeshStandardMaterial({color:'#a6a493'}));base.rotation.x=-Math.PI/2;base.position.y=-.04;scene.add(base);for(const [data,model] of [[SPANNER,createSpanner()],[POPULAR_LANDMARKS.find(x=>x.model==='mall'),null]]){if(!data)continue;const actual=model||createAccraMall(data),p=roundaboutLocal(data.position);actual.group.position.set(p[0],0,p[1]);scene.add(actual.group);}
const camera=new T.PerspectiveCamera(48,1,.1,2000),actors=new Map(),life=createPrecinctLife(),path=makeRoadPath(MALL_CIRCLE,3.2),cars=['taxi','bus','car'].map((kind,i)=>{const c=createVehicle(kind,[0xd0a345,0xd3bd8c,0x426479][i]);scene.add(c.group);return c});let view='overview',night=false,last=0;const setView=value=>{view=value;if(value==='monument'){camera.position.set(8,4.8,13);camera.lookAt(0,2.6,0);}if(value==='overview'){camera.position.set(190,165,190);camera.lookAt(25,0,-40);}if(value==='approach'){const p=roundaboutLocal(ROUNDABOUT_ARRIVAL);camera.position.set(p[0]-8,4.3,p[1]+9);camera.lookAt(0,1,-12);}};setView('overview');document.getElementById('overview').onclick=()=>setView('overview');document.getElementById('approach').onclick=()=>setView('approach');document.getElementById('monument').onclick=()=>setView('monument');document.getElementById('circle').onclick=()=>setView('circle');document.getElementById('night').onclick=()=>{night=!night;scene.background.set(night?'#192c43':'#b4cfdc');scene.environment=cityEnvironment(night?'night':'day');sun.intensity=night?.3:2.5;light.intensity=night?.7:1.6;};
function frame(ms){const t=ms/1000,dt=Math.min(.04,last?t-last:0);last=t;roundabout.update(t);cars.forEach((c,i)=>{const p=path.at((t*5+i*path.total/3)%path.total),q=roundaboutLocal(p.position);c.group.position.set(q[0],0,q[1]);c.group.rotation.y=-p.heading*Math.PI/180;if(view==='circle'&&i===0){const h=p.heading*Math.PI/180;camera.position.set(q[0]-Math.sin(h)*12,6,q[1]+Math.cos(h)*12);camera.lookAt(q[0]+Math.sin(h)*8,1,q[1]-Math.cos(h)*8);}});for(const a of life.tick(t,MALL_ROUNDABOUT.position,night?0:720)){let model=actors.get(a.id);if(!model){model=createActor(a.avatar,a.id);actors.set(a.id,model);scene.add(model.group);}const p=roundaboutLocal(a.position);model.group.visible=true;model.group.position.set(p[0],0,p[1]);model.group.rotation.y=-a.heading*Math.PI/180;model.animate(t,true,{speed:a.speed});}renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
