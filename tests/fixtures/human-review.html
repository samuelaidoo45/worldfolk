<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worldfolk · Character review</title>
<style>html,body{margin:0;height:100%;background:#dbe2df;color:#153e35;font:15px system-ui}canvas{width:100%;height:100%;display:block}header{position:absolute;left:24px;top:18px}h1{font-size:22px;margin:0}p{margin:5px 0}nav{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:8px;border-radius:15px;background:#fffffff0;flex-wrap:wrap;justify-content:center;max-width:95%;width:max-content}button{border:0;border-radius:8px;padding:11px 16px;background:#e9edea;color:#153e35;cursor:pointer}button[aria-pressed=true]{background:#176a51;color:white}#status{position:absolute;bottom:92px;left:0;right:0;text-align:center}#labels{position:absolute;top:78%;left:0;right:0;display:flex;justify-content:space-evenly;font-weight:600}</style>
<canvas></canvas><header><h1>Worldfolk · Humans & motion</h1><p>Local character review · 1.8 metre scale</p></header><div id="labels"><span>Previous character</span><span>Rigged civilian · male</span><span>Rigged civilian · female</span></div><output id="status">Loading local character assets…</output><nav id="controls"></nav>
<script type="module">
import * as T from '/game/three.module.js';import {createActor} from '/game/human-character.js';import {createFallbackActor} from '/game/actor-fallback.js';import {disposeScene} from '/game/render-utils.js';import {cityEnvironment} from '/game/graphics-materials.js';
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color(0xcdd9dc);scene.environment=cityEnvironment();scene.add(new T.HemisphereLight(0xe3efff,0x697564,2));const sun=new T.DirectionalLight(0xffe8ce,3);sun.position.set(-3,6,-4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.normalBias=.03;scene.add(sun);const fill=new T.DirectionalLight(0xcbdfff,1);fill.position.set(3,3,3);scene.add(fill);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0xb7bdb3,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;floor.receiveShadow=true;scene.add(floor);const camera=new T.PerspectiveCamera(40,1,.05,200);camera.position.set(0,1.8,-6.5);camera.lookAt(0,.94,0);
let action='idle',rotate=false;const names=['idle','walk','run','sit','sleep','dance','shower','drive','turn'];for(const name of names){const b=document.createElement('button');b.textContent=name;b.dataset.action=name;b.setAttribute('aria-pressed',String(name===action));b.onclick=()=>{if(name==='turn')rotate=!rotate;else action=name;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.action==='turn'?rotate:b.dataset.action===action)))};controls.append(b)}
try{const discarded=createActor('👨🏾','discarded');disposeScene(discarded.group);const actors=[createFallbackActor('🧑🏾'),createActor('👨🏾','civilian-1'),createActor('👩🏾','civilian-2')];const roots=actors.map(a=>a.group);actors.forEach((a,i)=>{scene.add(a.group);a.group.position.x=(1-i)*1.8});await Promise.all(actors.slice(1).map(a=>a.ready));if(await discarded.ready)throw new Error('Disposed actor was revived');actors.slice(1).forEach((a,i)=>{if(!a.rigged||a.group!==roots[i+1]||a.group.position.x!==-i*1.8)throw new Error('Actor upgrade lost its root or position')});document.querySelector('#status').textContent='Assets ready · idle';
function frame(ms){const t=ms/1000;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();actors.forEach((a,i)=>{a.animate(t,['walk','run'].includes(action),{speed:action==='run'?5.8:1.5,action:['idle','walk','run'].includes(action)?null:action});if(!a.pose&&['sit','drive'].includes(action)){a.leftLeg.rotation.x=a.rightLeg.rotation.x=-Math.PI/2;a.knees.forEach(k=>k.rotation.x=Math.PI/2)}a.group.position.x=(1-i)*1.8;a.group.rotation.set(action==='sleep'?-Math.PI/2:0,action==='sleep'?Math.PI:rotate?t*.3:0,0);if(action==='sleep')a.group.position.y=.55;if(['sit','drive'].includes(action))a.group.position.y=-.43});renderer.render(scene,camera);requestAnimationFrame(frame);document.querySelector('#status').textContent=`${action} · ${renderer.info.render.calls} draw calls · ${renderer.info.render.triangles.toLocaleString()} triangles`;}requestAnimationFrame(frame);
}catch(error){document.querySelector('#status').textContent=error.stack}
</script></html>
