<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worldfolk · Accra Mall review</title>
<style>body{margin:0;background:#aac7d2;color:#173d35;font:14px system-ui}.interior-canvas,#exterior{display:block;width:100vw;height:100vh}header,nav{position:fixed;z-index:3;background:#ffffffed;border-radius:12px;padding:10px}header{left:14px;top:14px;max-width:85%}h1{font-size:18px;margin:0 0 4px}nav{left:14px;bottom:14px;display:flex;gap:5px;flex-wrap:wrap;max-width:90%}button{border:0;background:#dce8e0;padding:10px;border-radius:8px;color:#173d35;cursor:pointer}output{display:block}#action{background:#eac56e}</style>
<canvas id="exterior"></canvas><header><h1>Accra Mall · reconstruction review</h1><output>Mapped footprint · photographed steel entrance tower</output></header><nav><button id="outside">Exterior</button><button id="inside">Walk inside</button><button id="food">Food court</button><button id="shop">Shoprite</button><button id="cinema">Cinema</button><button id="action">E · Interact</button></nav>
<script type="module">
import * as T from '/game/three.module.js';import {createAccraMall} from '/game/accra-mall.js';import {POPULAR_LANDMARKS} from '/game/popular-landmarks-data.js';import {MALL_ENTRANCE} from '/game/accra-mall-data.js';import {createAccraMallInterior} from '/game/accra-mall-interior.js';import {cityEnvironment} from '/game/graphics-materials.js';
const canvas=document.querySelector('#exterior'),r=new T.WebGLRenderer({canvas,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.shadowMap.enabled=true;const s=new T.Scene();s.environment=cityEnvironment();s.background=new T.Color('#abc8d5');s.add(new T.HemisphereLight('#def2ff','#6f6754',1.7));const light=new T.DirectionalLight('#ffe9c7',2.6);light.position.set(-70,90,-100);s.add(light);const data=POPULAR_LANDMARKS.find(l=>l.id==='accra-mall'),model=createAccraMall(data);s.add(model.group);const g=new T.Mesh(new T.PlaneGeometry(800,800),new T.MeshStandardMaterial({color:'#979b92'}));g.rotation.x=-Math.PI/2;g.position.y=-.04;s.add(g);const c=new T.PerspectiveCamera(50,1,.1,1500),ex=(MALL_ENTRANCE[0]-data.position[0])*111320*Math.cos(data.position[1]*Math.PI/180),ez=-(MALL_ENTRANCE[1]-data.position[1])*111320;c.position.set(ex-22,8,ez-34);c.lookAt(ex,7,ez);let inside=null,last=0;const keys=new Set(),out=document.querySelector('output');
function start(){inside?.destroy();inside=createAccraMallInterior({avatar:'👨🏾',identity:'mall-review',outfit:'everyday'});canvas.style.display='none'}
document.querySelector('#outside').onclick=()=>{inside?.destroy();inside=null;canvas.style.display='block';out.textContent='Mapped footprint · photographed steel entrance tower'};
document.querySelector('#inside').onclick=start;
document.querySelector('#food').onclick=()=>{start();inside.move(0,-24);inside.move(-5.5,0);inside.move(0,2.1)};
document.querySelector('#shop').onclick=()=>{start();inside.move(15,0);inside.move(0,-14);inside.move(9,0)};
document.querySelector('#cinema').onclick=()=>{start();inside.move(0,-69.8);inside.interact('upstairs')};
function interact(){const h=inside?.nearby();if(!h)return;if(h.kind==='exit'){document.querySelector('#outside').click();return}const result=inside.interact(h.actionId);if(result?.panel==='leisure'){out.textContent='Game purchase required: cinema ticket ₵45. Full game uses the server economy.';return}out.textContent=result?.dialogue||JSON.stringify(result||{})}
document.querySelector('#action').onclick=interact;addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE')interact()});addEventListener('keyup',e=>keys.delete(e.code));
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;const dx=(+keys.has('KeyD')-keys.has('KeyA'))*dt*5,dz=(+keys.has('KeyS')-keys.has('KeyW'))*dt*5;if(inside){inside.move(dx,dz);inside.render(t/1000,!!(dx||dz));const h=inside.nearby();document.querySelector('#action').textContent='E · '+(h?.label||'Move closer');}else{r.setSize(innerWidth,innerHeight,false);c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.render(s,c)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
