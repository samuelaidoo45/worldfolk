import * as T from '/public/game/three.module.js';import {roadPolygons} from '/public/game/road-geometry.js';import {SHANGRI_BLOCK,shangriLocal} from '/public/game/shangri-la-data.js';import {createShangriBlock} from '/public/game/shangri-la.js';import {cityEnvironment} from '/public/game/graphics-materials.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.environment=cityEnvironment();scene.background=new T.Color('#b2c6cd');scene.add(new T.HemisphereLight('#e4f1fa','#81715a',1.8));const sun=new T.DirectionalLight('#ffe6c7',2.6);sun.position.set(-100,180,100);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-160,right:160,top:160,bottom:-160,near:.1,far:600});sun.shadow.bias=-.0002;scene.add(sun);const camera=new T.PerspectiveCamera(52,1,.1,550);scene.add(createShangriBlock().group);const ground=new T.Mesh(new T.PlaneGeometry(380,380),new T.MeshStandardMaterial({color:'#a7a392'}));ground.receiveShadow=true;ground.rotation.x=-Math.PI/2;ground.position.y=-.06;scene.add(ground);const context=await (await fetch('./shangri-la-context.json')).json();for(const f of roadPolygons(context.road,SHANGRI_BLOCK.position)){const points=f.geometry.coordinates[0].map(shangriLocal),shape=new T.Shape(points.slice(0,-1).map(([x,z])=>new T.Vector2(x,-z))),geo=new T.ShapeGeometry(shape);geo.rotateX(-Math.PI/2);const m=new T.Mesh(geo,new T.MeshStandardMaterial({color:f.properties.color,roughness:1,side:T.DoubleSide}));m.position.y=f.properties.pavement ? .015 : .03;scene.add(m);}
