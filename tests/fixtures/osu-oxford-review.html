<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Osu Oxford Street review</title><style>body{margin:0;font:14px system-ui;background:#8eafb7}canvas{display:block;width:100vw;height:100vh}header,nav{position:fixed;z-index:2;background:#163830ed;color:#fff;padding:12px;border-radius:10px;left:12px}header{top:12px;max-width:85%}h1{margin:0;font-size:18px}nav{bottom:12px;display:flex;gap:8px;flex-wrap:wrap;max-width:90%}button{border:0;border-radius:8px;padding:10px;cursor:pointer}output{display:block;margin-top:5px}</style><canvas></canvas><header><h1>Osu · Oxford Street first block</h1><output>Three reference-based exteriors · photo-estimated heights</output></header><nav><button id="all">All buildings</button><button id="frankies">Frankie’s</button><button id="mall">Oxford Street Mall</button><button id="papaye">Papaye Osu</button><button id="street">Street approach</button><button id="night">Day / night</button></nav><script type="module">
import * as T from '/public/game/three.module.js';
import {createOsuSite} from '/public/game/osu-oxford.js';

import {OSU_SITES,osuLocal,osuPeople} from '/public/game/osu-oxford-data.js';
import {createActor} from '/public/game/human-character.js';
import {isCityLandmark} from '/public/game/city-landmarks.js';
import {cityEnvironment} from '/public/game/graphics-materials.js';
const origin=OSU_SITES[0],scene=new T.Scene();scene.background=new T.Color('#adc4c9');scene.environment=cityEnvironment();scene.fog=new T.Fog('#adc4c9',600,1300);
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const ambient=new T.HemisphereLight('#e7f2fc','#81745c',2),sun=new T.DirectionalLight('#ffe7c8',3);sun.position.set(-150,180,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-260,right:260,top:200,bottom:-200,near:1,far:600});sun.shadow.bias=-.0001;scene.add(ambient,sun);
const ground=new T.Mesh(new T.PlaneGeometry(1800,1800),new T.MeshStandardMaterial({color:'#81816a',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;ground.receiveShadow=true;scene.add(ground);
for(const s of OSU_SITES){const m=createOsuSite(s),p=osuLocal(origin,s.position);m.group.position.set(p[0],0,p[1]);scene.add(m.group);}

const context=await (await fetch('/tests/fixtures/osu-oxford-context.json')).json();
const asphalt=new T.MeshStandardMaterial({color:'#3c4447',roughness:.95}),curb=new T.MeshStandardMaterial({color:'#a0a29a',roughness:1});
for(const f of context.roads)for(let i=1;i<f.geometry.coordinates.length;i++){const a=osuLocal(origin,f.geometry.coordinates[i-1]),b=osuLocal(origin,f.geometry.coordinates[i]),len=Math.hypot(a[0]-b[0],a[1]-b[1]),width=f.properties.class==='service'?5:f.properties.class==='secondary'?9:7;for(const [w,h,m] of [[width+2.5,.016,curb],[width,.025,asphalt]]){const o=new T.Mesh(new T.BoxGeometry(len,h,w),m);o.rotation.y=-Math.atan2(b[1]-a[1],b[0]-a[0]);o.position.set((a[0]+b[0])/2,h/2,(a[1]+b[1])/2);o.receiveShadow=true;scene.add(o);}}
for(const f of context.buildings){if(isCityLandmark(f.id))continue;const r=f.geometry.coordinates[0].map(p=>osuLocal(origin,p)),shape=new T.Shape(r.slice(0,-1).map(p=>new T.Vector2(p[0],-p[1]))),g=new T.ExtrudeGeometry(shape,{depth:f.properties.height||4.5,bevelEnabled:false});g.rotateX(-Math.PI/2);const o=new T.Mesh(g,new T.MeshStandardMaterial({color:'#b9b1a1',roughness:.9}));o.castShadow=o.receiveShadow=true;scene.add(o);}
const camera=new T.PerspectiveCamera(48,1,.15,2000);let selected=origin,night=false;
function view(name){if(name==='all'){camera.position.set(260,140,170);camera.lookAt(0,5,85);document.querySelector('output').textContent='Frankie’s · Oxford Street Mall · Papaye Osu';return;}if(name==='street'){const p=osuLocal(origin,selected.arrival),target=osuLocal(origin,selected.target);camera.position.set(p[0]+(selected.family==='papaye'?-13:14),3.2,p[1]+5);camera.lookAt(target[0],selected.family==='mall'?9:7,target[1]);return;}selected=OSU_SITES.find(s=>s.family===name);const p=osuLocal(origin,selected.position);camera.position.set(p[0]+(name==='papaye'?-42:52),24,p[1]+30);camera.lookAt(p[0],7,p[1]);document.querySelector('output').textContent=selected.description;}
for(const name of ['all','frankies','mall','papaye','street'])document.getElementById(name).onclick=()=>view(name);document.getElementById('night').onclick=()=>{night=!night;scene.environment=cityEnvironment(night?'night':'day');scene.background.set(night?'#152738':'#adc4c9');ambient.intensity=night?.55:2;sun.intensity=night?.3:3;};view('frankies');const people=new Map();
function frame(ms){for(const s of OSU_SITES)for(const d of osuPeople(ms/1000,s.arrival,720)){let a=people.get(d.id);if(!a){a=createActor(d.avatar,d.id);people.set(d.id,a);scene.add(a.group);}const p=osuLocal(origin,d.position);a.group.position.set(p[0],d.poseOffset||0,p[1]);a.group.rotation.y=-d.heading*Math.PI/180;a.animate(ms/1000,d.moving,{speed:d.speed,action:d.action});}renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
