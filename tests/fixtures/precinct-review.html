<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worldfolk · Independence precinct</title>
<style>body{margin:0;font:14px system-ui;color:#173d35}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:16px;left:18px;padding:14px 18px;background:#fffffff0;border-radius:16px}h1{font-size:21px;margin:0 0 5px}nav{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#fffffff0;border-radius:16px;padding:8px;display:flex;gap:8px}button{border:0;border-radius:9px;background:#e4eae5;padding:12px;cursor:pointer;color:#173d35}button[aria-pressed=true]{background:#1c6953;color:white}</style>
<canvas></canvas><header><h1>Worldfolk · Independence precinct</h1><output>Black Star Gate · stonework and three portals</output></header><nav><button data-view="gate">Black Star Gate</button><button data-view="arch">Independence Arch</button><button data-view="stand">Grandstand</button><button data-view="square">Whole square</button></nav>
<script type="module">
import * as T from '/game/three.module.js';import {CITY_LANDMARKS,createCityLandmark} from '/game/city-landmarks.js';import {disposeScene} from '/game/render-utils.js';import {cityEnvironment} from '/game/graphics-materials.js';
const r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#b4d1df');scene.environment=cityEnvironment();scene.add(new T.HemisphereLight('#d3edff','#686850',1.6));const sun=new T.DirectionalLight('#fff0d4',3);sun.position.set(-60,90,60);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-100,right:100,top:100,bottom:-100,far:250});sun.shadow.normalBias=.035;scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(1500,1500),new T.MeshStandardMaterial({color:'#a2a39b',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;ground.receiveShadow=true;scene.add(ground);
const camera=new T.PerspectiveCamera(43,1,.1,1600);const models=new T.Group();scene.add(models);
function view(id){for(const child of [...models.children])disposeScene(child);models.clear();const gate=CITY_LANDMARKS.find(l=>l.id==='black-star-gate'),arch=CITY_LANDMARKS.find(l=>l.id==='independence-arch'),stand=CITY_LANDMARKS.find(l=>l.id.startsWith('square-stand'));let selected=id==='gate'?gate:id==='arch'?arch:stand;
 if(id==='square'){for(const d of CITY_LANDMARKS.filter(l=>!l.model)){const m=createCityLandmark(d).group;m.position.set((d.position[0]+.19256)*110800,0,-(d.position[1]-5.54742)*111320);models.add(m);}camera.position.set(210,235,335);camera.lookAt(0,0,-30);}else{const m=createCityLandmark(selected).group;m.rotation.y=0;models.add(m);camera.position.set(id==='gate'?32:id==='arch'?43:32,id==='gate'?12:id==='arch'?16:13,id==='gate'?65:id==='arch'?74:42);camera.lookAt(0,id==='gate'?11:id==='arch'?13:4,0);}
 document.querySelector('output').textContent=id==='square'?'Mapped positions · eight grandstands · separate gate and arch':selected.name+' · exterior reconstruction';for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.view===id));}
for(const b of document.querySelectorAll('button'))b.onclick=()=>view(b.dataset.view);view('gate');
function frame(){r.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.render(scene,camera);requestAnimationFrame(frame)}frame();
</script></html>
