<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kofi Annan Street review</title><style>body{margin:0;font:14px system-ui;background:#8eafb7}canvas{display:block;width:100vw;height:100vh}header,nav{position:fixed;z-index:2;background:#163830ed;color:#fff;padding:12px;border-radius:10px;left:12px}header{top:12px;max-width:85%}h1{margin:0;font-size:18px}nav{bottom:12px;display:flex;gap:8px;flex-wrap:wrap;max-width:90%}button{border:0;border-radius:8px;padding:10px;cursor:pointer}output{display:block;margin-top:5px}</style><canvas></canvas><header><h1>Kofi Annan Street · next Villaggio-area batch</h1><output>Three mapped sites · photo-estimated heights</output></header><nav><button id="all">All buildings</button><button id="octavia">Octavia 154</button><button id="hospital">Airport Women’s Hospital</button><button id="kwarleyz">Kwarleyz Residence</button><button id="street">Street approach</button><button id="night">Day / night</button></nav><script type="module">
import * as T from '/public/game/three.module.js';
import {createKofiAnnanSite} from '/public/game/kofi-annan.js';

import {KOFI_SITES,kofiLocal,kofiPeople} from '/public/game/kofi-annan-data.js';
import {createActor} from '/public/game/human-character.js';
import {cityEnvironment} from '/public/game/graphics-materials.js';
const origin=KOFI_SITES[0],scene=new T.Scene();scene.background=new T.Color('#adc4c9');scene.environment=cityEnvironment();scene.fog=new T.Fog('#adc4c9',600,1300);
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const ambient=new T.HemisphereLight('#e7f2fc','#81745c',2),sun=new T.DirectionalLight('#ffe7c8',3);sun.position.set(-150,180,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-260,right:260,top:200,bottom:-200,near:1,far:600});sun.shadow.bias=-.0001;scene.add(ambient,sun);
const ground=new T.Mesh(new T.PlaneGeometry(1800,1800),new T.MeshStandardMaterial({color:'#81816a',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;ground.receiveShadow=true;scene.add(ground);
for(const s of KOFI_SITES){const m=createKofiAnnanSite(s),p=kofiLocal(origin,s.position);m.group.position.set(p[0],0,p[1]);scene.add(m.group);}

const context=await (await fetch('/tests/fixtures/kofi-annan-context.json')).json();
const asphalt=new T.MeshStandardMaterial({color:'#3c4447',roughness:.95}),curb=new T.MeshStandardMaterial({color:'#a0a29a',roughness:1});
for(const f of context.roads)for(let i=1;i<f.geometry.coordinates.length;i++){const a=kofiLocal(origin,f.geometry.coordinates[i-1]),b=kofiLocal(origin,f.geometry.coordinates[i]),len=Math.hypot(a[0]-b[0],a[1]-b[1]),width=f.properties.class==='service'?5:7;for(const [w,h,m] of [[width+2.5,.016,curb],[width,.025,asphalt]]){const o=new T.Mesh(new T.BoxGeometry(len,h,w),m);o.rotation.y=-Math.atan2(b[1]-a[1],b[0]-a[0]);o.position.set((a[0]+b[0])/2,h/2,(a[1]+b[1])/2);o.receiveShadow=true;scene.add(o);}}
const camera=new T.PerspectiveCamera(48,1,.15,2000);let selected=origin,night=false;
function view(name){if(name==='all'){camera.position.set(195,170,360);camera.lookAt(115,8,95);document.querySelector('output').textContent='Octavia 154 · Airport Women’s Hospital · Kwarleyz Residence';return;}if(name==='street'){const p=kofiLocal(origin,selected.arrival),target=kofiLocal(origin,selected.target);camera.position.set(p[0]+2,2.3,p[1]+6);camera.lookAt(target[0],selected.family==='hospital'?3:12,target[1]);return;}selected=KOFI_SITES.find(s=>s.family===name);const p=kofiLocal(origin,selected.position);camera.position.set(p[0]+(name==='kwarleyz'?-80:70),name==='hospital'?25:48,p[1]+100);camera.lookAt(p[0],name==='hospital'?3:12,p[1]);document.querySelector('output').textContent=selected.description;}
for(const name of ['all','octavia','hospital','kwarleyz','street'])document.getElementById(name).onclick=()=>view(name);document.getElementById('night').onclick=()=>{night=!night;scene.environment=cityEnvironment(night?'night':'day');scene.background.set(night?'#152738':'#adc4c9');ambient.intensity=night?.55:2;sun.intensity=night?.3:3;};view('all');const people=new Map();
function frame(ms){for(const s of KOFI_SITES)for(const d of kofiPeople(ms/1000,s.arrival,720)){let a=people.get(d.id);if(!a){a=createActor(d.avatar,d.id);people.set(d.id,a);scene.add(a.group);}const p=kofiLocal(origin,d.position);a.group.position.set(p[0],d.poseOffset||0,p[1]);a.group.rotation.y=-d.heading*Math.PI/180;a.animate(ms/1000,d.moving,{speed:d.speed,action:d.action});}renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
