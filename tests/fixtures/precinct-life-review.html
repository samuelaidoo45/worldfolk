<!doctype html><meta charset="utf-8"><title>Worldfolk · Square visitors</title><style>body{margin:0;font:14px system-ui;background:#a4cadd}canvas{display:block}nav{position:absolute;top:16px;left:16px;background:#fffe;padding:12px;border-radius:12px}button{padding:10px;margin:3px;border:0;border-radius:8px;background:#dce7e0;color:#173e34}</style><canvas></canvas><nav>Independence Square · daytime visitors<br><button data-view="stand">Grandstand seating</button><button data-view="plaza">Plaza gathering</button><button data-view="photo">Photo spot</button></nav><script type="module">
import * as T from '/game/three.module.js';import {createActor} from '/game/human-character.js';import {CITY_LANDMARKS,createCityLandmark} from '/game/city-landmarks.js';import {PRECINCT_LANDMARKS,precinctPoint} from '/game/precinct-navigation.js';import {createPrecinctLife,PRECINCT_ACTIVITIES} from '/game/precinct-life.js';import {cityEnvironment} from '/game/graphics-materials.js';
const square=PRECINCT_LANDMARKS.find(p=>p.id==='independence-parade-ground'),xyz=p=>new T.Vector3((p[0]-square.position[0])*110798,0,(square.position[1]-p[1])*111320),scene=new T.Scene();scene.background=new T.Color('#aed0df');scene.environment=cityEnvironment();scene.add(new T.HemisphereLight(0xd3edff,0x706d55,1.6));const sun=new T.DirectionalLight(0xffeed0,2.5);sun.position.set(-60,100,50);scene.add(sun);
for(const d of CITY_LANDMARKS.filter(d=>d.id.startsWith('square-stand')||['unknown-soldier','independence-arch','black-star-gate','independence-parade-ground'].includes(d.id))){const model=createCityLandmark(d);model.group.position.copy(xyz(d.position));scene.add(model.group)}
const ground=new T.Mesh(new T.PlaneGeometry(800,800),new T.MeshStandardMaterial({color:0x9c9c91,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;scene.add(ground);
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;const camera=new T.PerspectiveCamera(55,1,.1,1500),crowd=createPrecinctLife(),models=new Map();let view='plaza';
function change(kind){view=kind;const point=kind==='stand'?crowd.tick(0,square.position,720).find(p=>p.id==='square-visitor-0').position:kind==='photo'?PRECINCT_ACTIVITIES[8].position:precinctPoint(square,10,-5);const target=xyz(point);camera.position.copy(target).add(kind==='stand'?new T.Vector3(8,3,-1):kind==='photo'?new T.Vector3(-5,3,-7):new T.Vector3(13,6,16));camera.lookAt(target.x,target.y+1,target.z)}for(const b of document.querySelectorAll('button'))b.onclick=()=>change(b.dataset.view);change('plaza');
function frame(now){for(const d of crowd.tick(now/1000,square.position,720)){let a=models.get(d.id);if(!a){a=createActor(d.avatar,d.id);models.set(d.id,a);scene.add(a.group)}a.animate(now/1000,d.moving,{speed:d.speed,action:d.action});a.group.position.add(new T.Vector3(0,(d.elevation||0)+(d.poseOffset||0),0));const p=xyz(d.position);a.group.position.x=p.x;a.group.position.z=p.z;a.group.rotation.y=-d.heading*Math.PI/180;}renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
