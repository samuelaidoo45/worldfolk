<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apartment interior review</title><style>body{margin:0;font:13px system-ui;color:white;background:#18322f}.interior-canvas{position:fixed;inset:0;width:100%;height:100%}nav{position:fixed;bottom:10px;left:10px;right:10px;z-index:2;background:#15392eeb;padding:10px;border-radius:14px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}button{padding:8px 12px;background:#e4dcc7;border:0;border-radius:9px;color:#15392e}#status{flex-basis:100%}header{position:fixed;top:12px;left:12px;z-index:2;background:#15392eeb;border-radius:12px;padding:10px 16px}</style><header id="title"></header><nav><button id="gallery">Gallery</button><button id="signature">Signature</button><button id="villaggio">Villaggio</button><button data-walk="relax">Lounge</button><button data-walk="sleep">Bedroom</button><button data-walk="shower">Bathroom</button><button data-walk="cook">Kitchen</button><button data-walk="terrace">Terrace</button><button data-walk="exit">Entrance</button><button id="use">Interact</button><button id="left">Look left</button><button id="right">Look right</button><button id="first">First / third person</button><div id="status"></div></nav><script type="module">
import {createApartmentInterior} from '/game/apartment-interior.js';
let room,path=[],view='third',walking=false,frame=0;
function open(kind){room?.destroy();room=createApartmentInterior({kind,avatar:'👨🏾',identity:'apartment-review',outfit:'casual'});path=[];document.querySelector('#title').textContent=room.name}
for(const kind of ['signature','villaggio','gallery'])document.getElementById(kind).onclick=()=>open(kind);
function walk(id){if(room.isActing)return;const {model,physics}=room.debug,target=id==='exit'?model.layout.exit:model.hotspots.find(h=>h.id===id).at,start=room.position,step=.25,queue=[start],keys=p=>p.map(v=>v.toFixed(2)).join(','),seen=new Map([[keys(start),null]]);let end;
for(let i=0;i<queue.length;i++){const p=queue[i];if(Math.hypot(p[0]-target[0],p[1]-target[1])<.28){end=p;break}for(const d of [[step,0],[-step,0],[0,step],[0,-step]]){const n=p.map((v,j)=>v+d[j]);if(seen.has(keys(n))||!physics.clear(...n)||!physics.visible(p,n))continue;seen.set(keys(n),p);queue.push(n)}}path=[];while(end){path.unshift(end);end=seen.get(keys(end))}room.look(-room.bearing)}
for(const b of document.querySelectorAll('[data-walk]'))b.onclick=()=>walk(b.dataset.walk);
document.querySelector('#use').onclick=()=>{const h=room.nearby();if(h?.kind==='exit'){document.querySelector('#title').textContent='Returned to courtyard';room.destroy();room=null;return}room?.interact(h?.actionId)};
document.querySelector('#left').onclick=()=>room.look(-45);document.querySelector('#right').onclick=()=>room.look(45);document.querySelector('#first').onclick=()=>view=view==='first'?'third':'first';
open('signature');let last=0;function render(t){requestAnimationFrame(render);if(!room)return;const dt=Math.min(.05,(t-last)/1000||.016);last=t;walking=path.length>0;if(path.length){const at=room.position,n=path[0],len=Math.hypot(n[0]-at[0],n[1]-at[1]);if(len<.03)path.shift();else room.move((n[0]-at[0])/len*Math.min(len,dt*4),(n[1]-at[1])/len*Math.min(len,dt*4))}room.render(t/1000,walking,view);if(frame++%10===0){document.querySelector('#status').textContent=room.description+' · '+(room.nearby()?.label||'Explore')+' · '+room.position.map(v=>v.toFixed(1)).join(', ');document.querySelector('#use').textContent=room.nearby()?.label||'Interact'}}requestAnimationFrame(render);
</script></html>
