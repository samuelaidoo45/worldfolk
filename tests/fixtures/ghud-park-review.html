<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ghud Park · ACC-264</title><style>body{margin:0;background:#becdd1;color:#fff;font:13px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:fixed;left:14px;top:14px;background:#173c35e8;padding:12px 16px;border-radius:6px;max-width:370px}small{display:block;margin-top:6px;color:#e1e2cd}nav{position:fixed;left:14px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap}button{padding:12px;color:#f9e9bb;background:#173c35;border:1px solid #ced3c5;border-radius:5px}</style><canvas aria-label="Ghud Park model preview"></canvas><header><strong>GHUD PARK · ACCRA MALL</strong><small>Photo-led playable park · interpreted dimensions.<br>Wider district omitted from this isolated preview.</small></header><nav><button id="overview">Overview</button><button id="plaza">Social plaza</button><button id="play">Playground</button><button id="lawn">Lawn trail</button></nav><script type="module">
import * as T from '/game/three.module.js';import {createGhudPark} from '/game/ghud-park.js';import {GHUD_PARK,ghudLocal,ghudPeople} from '/game/ghud-park-data.js';import {createActor} from '/game/human-character.js';import {cityEnvironment} from '/game/graphics-materials.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;const scene=new T.Scene();scene.background=new T.Color('#bfd0d4');scene.environment=cityEnvironment();const sun=new T.DirectionalLight('#fff1d9',2.5);sun.position.set(-30,75,35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,far:200});sun.shadow.bias=-.0004;scene.add(sun,new T.HemisphereLight('#e4edf4','#8a8674',1.7));const floor=new T.Mesh(new T.PlaneGeometry(400,400),new T.MeshStandardMaterial({color:'#878a7c',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;floor.receiveShadow=true;scene.add(floor,createGhudPark().group);const camera=new T.PerspectiveCamera(55,1,.1,600),a=GHUD_PARK.rotation*Math.PI/180;
const xyz=([x,y,z])=>[x*Math.cos(a)+z*Math.sin(a),y,z*Math.cos(a)-x*Math.sin(a)];
const views={overview:[[-83,72,127],[0,0,0]],plaza:[[-31,3.1,39],[-3,1.3,64]],play:[[5,2.7,17],[21,2,29]],lawn:[[-31,2.2,15],[-27,1.3,-40]]};function view(id){camera.position.set(...xyz(views[id][0]));camera.lookAt(...xyz(views[id][1]));}for(const id of Object.keys(views))document.getElementById(id).onclick=()=>view(id);view('overview');
