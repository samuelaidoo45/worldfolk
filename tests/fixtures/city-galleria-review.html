<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Galleria review</title><style>body{margin:0;font:14px system-ui;background:#bad0dd}canvas{width:100vw;height:100vh;display:block}.interior-canvas{position:fixed;inset:0}header,nav{z-index:20;position:fixed;left:16px;background:#173c35e8;color:#fff;padding:14px;border-radius:6px}header{top:16px}nav{bottom:16px;display:flex;gap:8px}button{background:#173c35;color:#fce1a3;border:1px solid #d1d8cd;padding:12px}small{display:block;margin-top:6px}</style><canvas aria-label="City Galleria model review"></canvas><header><b>CITY GALLERIA · SPINTEX ROAD</b><small>Photo-informed exterior · interpreted playable interiors</small></header><nav><button id="exterior">Exterior</button><button id="retail">Retail lobby</button><button id="offices">Upper offices</button><button id="rooftop">Rooftop terrace</button><button id="explore">Explore lobby</button><button id="use">E · Interact</button><span id="prompt"></span></nav><script type="module">
import * as T from '/game/three.module.js';import {createCityGalleria} from '/game/city-galleria.js';import {buildCityGalleriaInterior} from '/game/city-galleria-interior-model.js';import {createCityGalleriaInterior} from '/game/city-galleria-interior.js';import {cityEnvironment} from '/game/graphics-materials.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;const scene=new T.Scene();scene.background=new T.Color('#b9ced9');scene.environment=cityEnvironment();const sun=new T.DirectionalLight('#fff0da',2.5);sun.position.set(-40,75,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-100,right:100,top:100,bottom:-100,far:240});sun.shadow.bias=-.0004;scene.add(sun,new T.HemisphereLight('#dcebf5','#8c8067',1.6));const floor=new T.Mesh(new T.PlaneGeometry(300,300),new T.MeshStandardMaterial({color:'#8a887d',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);const models={exterior:createCityGalleria().group,...Object.fromEntries(['retail','offices','rooftop'].map(id=>[id,buildCityGalleriaInterior(id).group]))};Object.values(models).forEach(g=>scene.add(g));const camera=new T.PerspectiveCamera(55,1,.1,500),views={exterior:[[-85,30,-74],[-20,10,5]],retail:[[0,2.7,22],[0,1,-10]],offices:[[0,2.8,18],[-3,1,0]],rooftop:[[-14,10,24],[0,0,-4]]};let interior=null;const keys=new Set();document.addEventListener('keydown',e=>{if(e.code==='KeyE')use();keys.add(e.code)});document.addEventListener('keyup',e=>keys.delete(e.code));function use(){const h=interior?.nearby();if(h?.kind==='exit'){interior.destroy();interior=null;return;}const result=interior?.interact(h?.actionId);if(result?.dialogue)document.getElementById('prompt').textContent=result.dialogue;if(result?.panel)document.getElementById('prompt').textContent='Open '+result.panel+' · '+JSON.stringify(result.context);}document.getElementById('use').onclick=use;document.getElementById('explore').onclick=()=>{interior?.destroy();interior=createCityGalleriaInterior({avatar:'👨🏾',identity:'galleria-preview',outfit:'casual'});};function view(id){if(interior){interior.destroy();interior=null;}Object.entries(models).forEach(([k,g])=>g.visible=k===id);floor.visible=id==='exterior';camera.position.set(...views[id][0]);camera.lookAt(...views[id][1]);}Object.keys(models).forEach(id=>document.getElementById(id).onclick=()=>view(id));view('exterior');let last=0;function frame(ms=0){const t=ms/1000,dt=Math.min(.05,t-last||.016);last=t;if(interior){const dx=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0),dz=(keys.has('KeyS')?1:0)-(keys.has('KeyW')?1:0);interior.move(dx*dt*5,dz*dt*5);interior.render(t,!!(dx||dz),'third');document.getElementById('use').textContent='E · '+(interior.nearby()?.label||'Walk to interact');document.getElementById('prompt').textContent=interior.name+' · '+interior.position.map(n=>n.toFixed(1)).join(', ')+' · WASD move';requestAnimationFrame(frame);return;}renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
</script></html>
