<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Airport Terminal 2 review</title><style>body{margin:0;font:14px system-ui;background:#8eafb7}canvas{display:block;width:100vw;height:100vh}header,nav{position:fixed;z-index:2;background:#163830ed;color:#fff;padding:12px;border-radius:10px;left:12px}header{top:12px;max-width:85%}h1{margin:0;font-size:18px}nav{bottom:12px;display:flex;gap:8px;flex-wrap:wrap;max-width:90%}button{border:0;border-radius:8px;padding:10px;cursor:pointer}output{display:block;margin-top:5px}</style><canvas></canvas><header><h1>Accra International Airport · Terminal 2</h1><output>Native outlines · historic shell / interpreted renovation screen · public approach</output></header><nav><button id="overview">Overview</button><button id="forecourt">Forecourt</button><button id="arrivals">Covered waiting</button><button id="departure">Works frontage</button><button id="night">Day / night</button></nav><script type="module">
import * as T from '/public/game/three.module.js';
import {createAirportT2} from '/public/game/airport-t2.js';
import {AIRPORT_T2,T2_ARRIVAL,airportT2People} from '/public/game/airport-t2-data.js';
import {t2Point,t2World} from '/public/game/airport-t2-data.js';

import {createActor} from '/public/game/human-character.js';
import {cityEnvironment} from '/public/game/graphics-materials.js';
const origin=AIRPORT_T2,scene=new T.Scene();scene.background=new T.Color('#adc4c9');scene.environment=cityEnvironment();scene.fog=new T.Fog('#adc4c9',600,1300);
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const ambient=new T.HemisphereLight('#e7f2fc','#81745c',2),sun=new T.DirectionalLight('#ffe7c8',3);sun.position.set(-150,180,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-350,right:350,top:300,bottom:-300,near:1,far:900});sun.shadow.bias=-.0001;scene.add(ambient,sun);
const ground=new T.Mesh(new T.PlaneGeometry(1800,1800),new T.MeshStandardMaterial({color:'#81816a',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;ground.receiveShadow=true;scene.add(ground);
const terminal=createAirportT2();scene.add(terminal.group);
const camera=new T.PerspectiveCamera(48,1,.15,2000);let night=false;


function setView(from,target){const a=t2World(t2Point(from[0],from[2])),b=t2World(t2Point(target[0],target[2]));camera.position.set(a[0],from[1],a[1]);camera.lookAt(b[0],target[1],b[1]);}
function view(name){if(name==='overview')setView([-155,100,-170],[0,5,15]);if(name==='forecourt')setView([-70,3,-20],[-20,6,28]);if(name==='arrivals')setView([-58,1.8,8],[-25,2.2,15]);if(name==='departure')setView([47,3,-16],[83,4,17]);document.querySelector('output').textContent=name;}
for(const id of ['overview','forecourt','arrivals','departure'])document.getElementById(id).onclick=()=>view(id);
document.getElementById('night').onclick=()=>{night=!night;scene.environment=cityEnvironment(night?'night':'day');scene.background.set(night?'#152738':'#adc4c9');ambient.intensity=night?.55:2;sun.intensity=night?.3:3;};view('overview');const people=new Map();
function frame(ms){
for(const d of airportT2People(ms/1000,T2_ARRIVAL)){let a=people.get(d.id);if(!a){a=createActor(d.avatar,d.id);people.set(d.id,a);scene.add(a.group);}const p=t2World(d.position);a.group.position.set(p[0],d.poseOffset||0,p[1]);a.group.rotation.y=-d.heading*Math.PI/180;a.animate(ms/1000,d.moving,{speed:d.speed,action:d.action});}
renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
