<!doctype html><meta charset="utf-8"><title>Lancaster Accra Hotel review</title><style>body{margin:0;font:14px system-ui;background:#acc4cd}canvas{width:100vw;height:100vh;display:block}header,nav{position:fixed;left:12px;background:#19392ee8;color:#f3e6cf;padding:12px;border-radius:9px;z-index:2}header{top:12px}nav{bottom:12px;display:flex;gap:8px}button{padding:10px;border:0;border-radius:5px}h1{font-size:18px;margin:0}</style><canvas></canvas><header><h1>Lancaster Accra Hotel</h1><span>Photo-informed exterior and public rooms · estimated layout</span></header><nav><button id="exterior">Exterior</button><button id="lobby">Timber atrium</button><button id="branche">Branche</button><button id="garden">Garden pool</button><button id="cafe">Java Café</button></nav><script type="module">
import * as T from '/public/game/three.module.js';import {createLancaster} from '/public/game/lancaster.js';import {buildLancasterInterior} from '/public/game/lancaster-interior-model.js';import {createActor} from '/public/game/human-character.js';import {cityEnvironment} from '/public/game/graphics-materials.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.environment=cityEnvironment();scene.background=new T.Color('#b2c6cd');scene.add(new T.HemisphereLight('#e4f1fa','#81715a',1.8));const sun=new T.DirectionalLight('#ffe6c7',2.6);sun.position.set(-20,35,40);scene.add(sun);const camera=new T.PerspectiveCamera(52,1,.1,300);const exterior=createLancaster().group;scene.add(exterior);const models=Object.fromEntries(['lobby','branche','garden','cafe'].map(id=>{const m=buildLancasterInterior(id).group;scene.add(m);return[id,m]}));const ground=new T.Mesh(new T.PlaneGeometry(220,220),new T.MeshStandardMaterial({color:'#aaa38e'}));ground.rotation.x=-Math.PI/2;ground.position.y=-.06;scene.add(ground);const actor=createActor('👩🏾','hotel-review');actor.group.position.set(-1,0,-3);scene.add(actor.group);
function show(id){exterior.visible=id==='exterior';ground.visible=id==='exterior';actor.group.visible=id!=='exterior';actor.group.position.set(...(id==='garden'?[8.5,0,2]:[-1,0,-3]));for(const [key,m] of Object.entries(models))m.visible=id===key;camera.position.set(...(id==='exterior'?[110,25,-55]:id==='garden'?[8.8,2.6,11]:[1,3.4,12]));camera.lookAt(...(id==='exterior'?[20,6,-4]:id==='garden'?[0,4,-9]:[0,4,-9]));}for(const id of ['exterior','lobby','branche','garden','cafe'])document.getElementById(id).onclick=()=>show(id);show('exterior');function frame(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
</script>
