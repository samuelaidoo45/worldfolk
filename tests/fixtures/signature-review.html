<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worldfolk · The Signature review</title>
<style>body{margin:0;font:14px system-ui;background:#b6d3df}canvas{display:block;width:100vw;height:100vh}header,nav{position:fixed;background:#ffffffef;padding:12px;border-radius:12px;z-index:2}header{top:12px;left:12px;max-width:80%}h1{font-size:18px;margin:0 0 5px}nav{bottom:12px;left:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:90%}button{border:0;border-radius:8px;padding:11px;background:#dce9e3;color:#173b33;cursor:pointer}output{display:block;max-width:580px}</style>
<canvas></canvas><header><h1>The Signature · Accra</h1><output>Photo-referenced twin towers · mapped footprints · estimated dimensions</output></header><nav><button id="overview">Overview</button><button id="approach">Arrival</button><button id="court">Courtyard</button><button id="night">Day / night</button><button id="seat">Sit / stand</button></nav>
<script type="module">
import * as T from '/game/three.module.js';import {createSignature} from '/game/signature.js';import {SIGNATURE,SIGNATURE_ACTIVITIES,signatureLocal} from '/game/signature-data.js';import {createActor} from '/game/human-character.js';import {createPrecinctLife} from '/game/precinct-life.js';import {cityEnvironment} from '/game/graphics-materials.js';
const r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;const s=new T.Scene();s.background=new T.Color('#a9c9d8');s.environment=cityEnvironment();const ambient=new T.HemisphereLight('#e7f4ff','#706955',1.8),sun=new T.DirectionalLight('#ffecd0',3);sun.position.set(-70,100,70);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-100,right:100,top:100,bottom:-100,near:1,far:250});sun.shadow.bias=-.0001;s.add(ambient,sun);const model=createSignature();s.add(model.group);const floor=new T.Mesh(new T.PlaneGeometry(500,500),new T.MeshStandardMaterial({color:'#77806c'}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;s.add(floor);const camera=new T.PerspectiveCamera(48,1,.1,1000),life=createPrecinctLife(),actors=new Map(),own=createActor('👨🏾','signature-review');s.add(own.group);let night=false,sitting=false;
const views={overview:[[-90,70,125],[0,20,0]],approach:[[-42,5,54],[8,23,-4]],court:[[-27,7,38],[7,13,0]]};function view(name){camera.position.set(...views[name][0]);camera.lookAt(...views[name][1]);}view('overview');for(const name of ['overview','approach','court'])document.getElementById(name).onclick=()=>view(name);
document.getElementById('night').onclick=()=>{night=!night;s.background.set(night?'#172a43':'#a9c9d8');s.environment=cityEnvironment(night?'night':'day');ambient.intensity=night?.65:1.8;sun.intensity=night?.4:3;};
document.getElementById('seat').onclick=()=>{sitting=!sitting;document.querySelector('output').textContent=sitting?'Sitting · stays seated until you choose Stand':'Standing · photo-referenced courtyard';document.getElementById('seat').textContent=sitting?'Stand':'Sit / stand';view('court');};
function frame(ms){const t=ms/1000,spot=SIGNATURE_ACTIVITIES[1],pos=signatureLocal(sitting?spot.seatPosition:spot.position);own.animate(t,false,{action:sitting?'sit':null});own.group.position.set(pos[0],sitting?-.45:0,pos[1]);own.group.rotation.y=-Math.PI/2;const visitors=life.tick(t,SIGNATURE.position,night?0:720);for(const a of actors.values())a.group.visible=false;for(const data of visitors){let a=actors.get(data.id);if(!a){a=createActor(data.avatar,data.id);actors.set(data.id,a);s.add(a.group);}const p=signatureLocal(data.position);a.group.visible=true;a.group.position.set(p[0],0,p[1]);a.group.rotation.y=-data.heading*Math.PI/180;a.animate(t,true,{speed:data.speed});}model.update(t);r.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.render(s,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
