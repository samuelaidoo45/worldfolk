<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accra Mall terminal review</title><style>body{margin:0;background:#1d2a2a;color:#fff;font:13px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:fixed;top:16px;left:16px;background:#112d2ce8;border:1px solid #fff4;padding:12px 16px;border-radius:8px}header strong{display:block}header small{display:block;max-width:340px;margin-top:4px;color:#c8d2ca}nav{position:fixed;bottom:16px;left:16px;display:flex;gap:8px;flex-wrap:wrap}button{background:#153c38;color:#fceac4;border:1px solid #fff5;padding:12px;border-radius:5px;cursor:pointer}</style><canvas aria-label="Terminal geometry and circulation review"></canvas><header><strong>Accra Mall tro-tro terminal · ACC-261</strong><small>Mapped site and service-road alignment. Shelter, bays and game services are interpreted; current close-ups remain required.</small><output id="status">Waiting area · three bays · clear access</output></header><nav><button id="overview">Overview</button><button id="bay">Boarding bays</button><button id="wait">Waiting area</button><button id="depart">Test minibus departure</button><button id="night">Day / night</button></nav><script type="module">
import * as T from '/game/three.module.js';import {createMallTerminal} from '/game/mall-terminal.js';import {MALL_TERMINAL,TERMINAL_SERVICES,terminalPeople,terminalLocal,terminalDeparture} from '/game/mall-terminal-data.js';import {createVehicle} from '/game/accra-vehicles.js';import {createActor} from '/game/human-character.js';import {createBuildingPhysics} from '/game/building-physics.js';import {makeRoadPath,advanceRoad} from '/game/traffic-routing.js';import {cityEnvironment} from '/game/graphics-materials.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color('#b1c8ce');scene.environment=cityEnvironment();const sun=new T.DirectionalLight('#fff0ce',2.7);sun.position.set(-80,130,70);const light=new T.HemisphereLight('#dfedfa','#756e5b',1.7);scene.add(sun,light);const floor=new T.Mesh(new T.PlaneGeometry(700,700),new T.MeshStandardMaterial({color:'#9b998d',roughness:.97}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;scene.add(floor);const model=createMallTerminal();scene.add(model.group);const camera=new T.PerspectiveCamera(48,1,.1,1800),actors=new Map(),car=createVehicle('minibus',0xc6c4b7);scene.add(car.group);car.group.visible=false;let night=false,last=0,movement=null,path=null,trip=null;
const physics=createBuildingPhysics({queryRenderedFeatures:()=>[],project:()=>({x:0,y:0}),getLayer:()=>true,isSourceLoaded:()=>true},()=>({transit:trip}));
function view(name){const values={overview:[[55,42,35],[4,0,-24]],bay:[[23,2.8,5],[8,1.2,-34]],wait:[[30,2.1,-31],[23,1.1,-42]]};camera.position.set(...values[name][0]);camera.lookAt(...values[name][1]);}view('overview');for(const name of ['overview','bay','wait'])document.getElementById(name).onclick=()=>view(name);document.getElementById('night').onclick=()=>{night=!night;scene.background.set(night?'#15283d':'#b1c8ce');scene.environment=cityEnvironment(night?'night':'day');sun.intensity=night?.3:2.7;light.intensity=night?.65:1.7;};document.getElementById('depart').onclick=()=>{trip={terminalId:MALL_TERMINAL.id,serviceId:'airport'};path=makeRoadPath(terminalDeparture(TERMINAL_SERVICES[0]),1.6);movement={distance:0,speed:0};physics.refresh(MALL_TERMINAL.position,true);car.group.visible=true;};
function frame(ms){const t=ms/1000,dt=Math.min(.04,last?t-last:0);last=t;model.update(t,MALL_TERMINAL.position,{transit:trip,preset:night?'night':'day'});const people=terminalPeople(t,night?60:720,trip);for(const a of actors.values())a.group.visible=false;for(const p of people){let a=actors.get(p.id);if(!a){a=createActor(p.avatar,p.id);actors.set(p.id,a);scene.add(a.group);}const q=terminalLocal(p.position);a.group.visible=true;a.group.position.set(q[0],p.poseOffset||0,q[1]);a.group.rotation.y=-p.heading*Math.PI/180;a.animate(t,p.moving,{speed:p.speed,action:p.action});}if(movement){const previous=movement.distance;movement=advanceRoad(path,movement.distance,movement.speed,dt,physics,[],'minibus');const q=terminalLocal(movement.position);car.group.position.set(q[0],0,q[1]);car.group.rotation.y=-movement.heading*Math.PI/180;car.animateVehicle({distance:movement.distance-previous,preset:night?'night':'day'},dt);camera.position.set(q[0]+13,7,q[1]+14);camera.lookAt(q[0],1,q[1]-5);document.getElementById('status').textContent=movement.distance>=path.total?'Departure reached Spintex Road':movement.blocked?'Departure blocked':`Minibus departure · ${Math.round(movement.distance)} / ${Math.round(path.total)} m`;}
renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
