<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airport Bypass and terminal links review</title><style>body{margin:0;font:14px system-ui;background:#adc2c7}canvas{display:block;width:100vw;height:100vh}header,nav{position:fixed;left:12px;padding:12px;background:#163b35ef;color:white;border-radius:10px;z-index:2;max-width:90%}header{top:12px}nav{bottom:12px;display:flex;gap:6px;flex-wrap:wrap}h1{font-size:18px;margin:0}button{border:0;border-radius:7px;padding:10px;cursor:pointer}</style><canvas></canvas><header><h1>Airport Bypass · Big Six · terminal approaches</h1><output>Native roads · photo-estimated streetscape · isolated daylight preview</output></header><nav><button id="annex">Parking annex</button><button id="works">Closed car park</button><button id="bigsix">Big Six</button><button id="split">Terminal split</button><button id="links">Terminal links</button><button id="first">Airport First</button><button id="second">Airport Second</button><button id="junction">Airport Road junction</button><button id="overview">Overview</button><button id="liberation">Liberation Road</button><button id="marina">Marina approach</button><button id="stanbic">South Liberation Link</button></nav><script type="module">
import {AIRPORT_ANNEX} from '/public/game/airport-annex-data.js';import {createAirportAnnex} from '/public/game/airport-annex.js';import {t3Point} from '/public/game/airport-t3-space.js';import {AIRPORT_ISLANDS} from '/public/game/airport-junction-data.js';import {createAirportIsland} from '/public/game/airport-junction.js';import {AIRPORT_T2} from '/public/game/airport-t2-data.js';import {createAirportT2} from '/public/game/airport-t2.js';import {AIRPORT_T3} from '/public/game/airport-t3-data.js';import {createAirportT3} from '/public/game/airport-t3.js';
import {AIRPORT_STOPS,airportStopPoint,airportStopPeople} from '/public/game/airport-stops-data.js';import {createAirportStop} from '/public/game/airport-stops.js';import {createActor} from '/public/game/human-character.js';import * as T from '/public/game/three.module.js';import {createAirportCorridor} from '/public/game/airport-corridor.js';import {corridorLocal} from '/public/game/airport-corridor-data.js';import {createBusinessSite} from '/public/game/airport-business.js';import {BUSINESS_SITES} from '/public/game/airport-business-data.js';import {createAirportCitySite} from '/public/game/airport-city.js';import {AIRPORT_CITY_SITES} from '/public/game/airport-city-data.js';import {cityEnvironment} from '/public/game/graphics-materials.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color('#adc2c7');scene.environment=cityEnvironment();scene.add(new T.HemisphereLight('#e3f1fa','#87745d',1.8));const sun=new T.DirectionalLight('#ffead0',3);sun.position.set(-60,95,65);scene.add(sun);const camera=new T.PerspectiveCamera(48,1,.1,2000);const ground=new T.Mesh(new T.PlaneGeometry(1800,1800),new T.MeshStandardMaterial({color:'#a59f8e',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);scene.add(createAirportCorridor().group);
for(const s of [...BUSINESS_SITES,...AIRPORT_CITY_SITES]){const group=(s.family==='marina'||s.family==='square'?createAirportCitySite(s):createBusinessSite(s)).group,[x,z]=corridorLocal(s.position);group.position.set(x,0,z);scene.add(group);}
for(const s of AIRPORT_STOPS){const {group}=createAirportStop(s),[x,z]=corridorLocal(s.position);group.position.set(x,0,z);scene.add(group);for(const npc of airportStopPeople(s,2)){const actor=createActor(npc.avatar),[nx,nz]=corridorLocal(npc.position);actor.group.position.set(nx,0,nz);actor.group.rotation.y=-npc.heading*Math.PI/180;actor.animate(2,npc.moving,{speed:npc.speed,action:npc.action});scene.add(actor.group);}}
for(const s of AIRPORT_ISLANDS){const {group}=createAirportIsland(s),[x,z]=corridorLocal(s.position);group.position.set(x,0,z);scene.add(group);}
for(const [data,factory] of [[AIRPORT_ANNEX,createAirportAnnex],[AIRPORT_T2,createAirportT2],[AIRPORT_T3,createAirportT3]]){const {group}=factory(),[x,z]=corridorLocal(data.position);group.position.set(x,0,z);scene.add(group);}
const views={annex:{from:[-.17272,5.60418],height:25,to:AIRPORT_ANNEX.position},works:{from:t3Point(0,-185),height:23,to:t3Point(0,-125)},bigsix:{from:[-.17595,5.60604],height:8,to:AIRPORT_ISLANDS[0].position},split:{from:[-.1736,5.606],height:10,to:AIRPORT_ISLANDS[1].position},links:{from:[-.1783,5.6038],height:240,to:[-.17375,5.6058]},first:{from:airportStopPoint(AIRPORT_STOPS[0],-10,-7),height:4,to:AIRPORT_STOPS[0].position},second:{from:airportStopPoint(AIRPORT_STOPS[1],-10,-7),height:4,to:AIRPORT_STOPS[1].position},junction:{from:[-.17657,5.60511],height:28,to:[-.17763,5.6055]},overview:{from:[-.1736,5.5983],height:350,to:[-.1771,5.6023]},liberation:{from:[-.17872,5.6018],height:9,to:[-.17815,5.604]},marina:{from:[-.17565,5.60228],height:11,to:[-.17595,5.6033]},stanbic:{from:[-.17672,5.59975],height:9,to:[-.17818,5.5996]}};
function show(id){const v=views[id],[x,z]=corridorLocal(v.from),[tx,tz]=corridorLocal(v.to);camera.position.set(x,v.height,z);camera.lookAt(tx,id==='overview'?0:4,tz);}for(const id of Object.keys(views))document.getElementById(id).onclick=()=>show(id);show('bigsix');function frame(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
</script>
