<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worldfolk · Kwame Nkrumah Memorial Park</title>
<style>body{margin:0;font:14px system-ui;color:#173d35}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:16px;left:18px;padding:14px 18px;background:#fffffff0;border-radius:16px}h1{font-size:21px;margin:0 0 5px}nav{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#fffffff0;border-radius:16px;padding:8px;display:flex;gap:8px}button{border:0;border-radius:9px;background:#e4eae5;padding:12px;cursor:pointer;color:#173d35}button[aria-pressed=true]{background:#1c6953;color:white}</style>
<canvas></canvas><header><h1>Kwame Nkrumah Memorial Park</h1><output></output></header><nav><button data-view="approach">Fountain approach</button><button data-view="aerial">Park overview</button><button data-view="statue">Statue</button><button data-view="museum">Museum</button><button data-view="walk">Walk the park</button></nav>
<script type="module">
import * as T from '/game/three.module.js';import {createNkrumahPark} from '/game/nkrumah-park.js';import {parkPoint,parkLocal} from '/game/nkrumah-park-data.js';import {cityEnvironment} from '/game/graphics-materials.js';import {createBuildingPhysics} from '/game/building-physics.js';import {nearPrecinctActivity} from '/game/precinct-life.js';
const r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#b4d1df');scene.environment=cityEnvironment();scene.add(new T.HemisphereLight('#d3edff','#686850',1.6));const sun=new T.DirectionalLight('#fff0d4',3);sun.position.set(-60,90,60);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-100,right:100,top:100,bottom:-100,far:250});sun.shadow.normalBias=.035;scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(1500,1500),new T.MeshStandardMaterial({color:'#a2a39b',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.1;ground.receiveShadow=true;scene.add(ground);
const model=createNkrumahPark();model.group.rotation.y=0;scene.add(model.group);const camera=new T.PerspectiveCamera(48,1,.1,1600);let position=parkPoint(0,76),walking=false;const keys=new Set();addEventListener('keydown',e=>keys.add(e.code));addEventListener('keyup',e=>keys.delete(e.code));const physics=createBuildingPhysics({queryRenderedFeatures:()=>[],project:()=>({x:0,y:0}),getLayer:()=>true,isSourceLoaded:()=>true});physics.refresh(position,true);
function view(id){walking=id==='walk';position=parkPoint(0,76);const v={approach:[[5,4.5,90],[0,9,0],'Marble blades · bronze statue · paired fountain walk'],aerial:[[98,90,155],[0,0,17],'Mapped grounds · garden paths · low museum'],statue:[[9,7,38],[0,5,23],'Draped bronze figure · pointing arm · stone pedestal'],museum:[[8,14,-26],[0,0,-43],'Walk-in interpretive gallery · roof opens above visitors'],walk:[[0,2,76],[0,9,0],'WASD to walk · central paths and gallery doorway are open']}[id];camera.position.set(...v[0]);camera.lookAt(...v[1]);if(id==='museum')position=parkPoint(0,-40);document.querySelector('output').textContent=v[2];for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.view===id));}
for(const b of document.querySelectorAll('button'))b.onclick=()=>view(b.dataset.view);view('approach');let last=performance.now();function frame(){const now=performance.now(),dt=Math.min(.04,(now-last)/1000);last=now;if(walking){const [x,z]=parkLocal(position),dx=+keys.has('KeyD')-keys.has('KeyA'),dz=+keys.has('KeyS')-keys.has('KeyW');position=physics.moveWalker(position,parkPoint(x+dx*5*dt,z+dz*5*dt),0).position;const p=parkLocal(position);camera.position.set(p[0],2,p[1]+6);camera.lookAt(p[0],1.5,p[1]-12);document.querySelector('output').textContent=nearPrecinctActivity(position)?.label||`WASD · x ${p[0].toFixed(1)} · z ${p[1].toFixed(1)}`;}model.update(now/1000,position);r.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.render(scene,camera);requestAnimationFrame(frame)}frame();
</script></html>
