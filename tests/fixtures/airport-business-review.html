<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airport City hotel and offices review</title><style>body{margin:0;font:14px system-ui;background:#adc2c7}canvas{display:block;width:100vw;height:100vh}header,nav{position:fixed;left:12px;padding:12px;background:#163b35ef;color:white;border-radius:10px;z-index:2;max-width:90%}header{top:12px}nav{bottom:12px;display:flex;gap:6px;flex-wrap:wrap}h1{font-size:18px;margin:0}button{border:0;border-radius:7px;padding:10px;cursor:pointer}</style><canvas></canvas><header><h1>Airport City</h1><output>Native source geometry · photo-interpreted architecture · isolated preview</output></header><nav><button id="marriott">Accra Marriott Hotel</button><button id="stanbic">Stanbic Heights</button><button id="atlantic">Atlantic Tower</button></nav><script type="module">
import * as T from '/public/game/three.module.js';import {createBusinessSite} from '/public/game/airport-business.js';import {BUSINESS_SITES} from '/public/game/airport-business-data.js';import {cityEnvironment} from '/public/game/graphics-materials.js';import {disposeScene} from '/public/game/render-utils.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color('#adc2c7');scene.environment=cityEnvironment();const hemi=new T.HemisphereLight('#e3f1fa','#87745d',1.8),sun=new T.DirectionalLight('#ffead0',3);sun.position.set(-60,95,65);scene.add(hemi,sun);const camera=new T.PerspectiveCamera(48,1,.1,1000);const ground=new T.Mesh(new T.PlaneGeometry(800,800),new T.MeshStandardMaterial({color:'#898675',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);let model;
function show(id){if(model){scene.remove(model);disposeScene(model);}const s=BUSINESS_SITES.find(s=>s.family===id);model=createBusinessSite(s).group;const views={marriott:[80,46,130],stanbic:[85,50,-85],atlantic:[-100,38,70]};camera.position.set(...views[id]);camera.lookAt(id==='marriott'?5:0,id==='marriott'?11:18,0);scene.add(model);document.querySelector('h1').textContent=s.name;}
for(const id of ['marriott','stanbic','atlantic'])document.getElementById(id).onclick=()=>show(id);show('marriott');function frame(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
</script>
