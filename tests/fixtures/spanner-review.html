<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worldfolk · Spanner bridge review</title>
<style>body{margin:0;font:14px system-ui;background:#b6d3df}canvas{display:block;width:100vw;height:100vh}header,nav{position:fixed;background:#fffffff0;padding:12px;border-radius:12px;z-index:2}header{top:12px;left:12px;max-width:80%}h1{font-size:18px;margin:0 0 5px}nav{bottom:12px;left:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:90%}button{border:0;border-radius:8px;padding:11px;background:#dce9e3;color:#173b33;cursor:pointer}</style>
<canvas></canvas><header><h1>Spanner pedestrian footbridge · Accra</h1><output>Photo-referenced arches · mapped stairs and ramps</output></header><nav><button id="overview">Overview</button><button id="deck">Deck view</button><button id="walk">Walk across</button><button id="ramp">Use ramp</button><button id="night">Day / night</button></nav>
<script type="module">
import * as T from '/game/three.module.js';import {createSpanner} from '/game/spanner.js';import {SPANNER,SPANNER_ROUTES,SPANNER_ARRIVAL,spannerLocal,spannerPoint} from '/game/spanner-data.js';import {createBuildingPhysics} from '/game/building-physics.js';import {createActor} from '/game/human-character.js';import {createPrecinctLife} from '/game/precinct-life.js';import {cityEnvironment} from '/game/graphics-materials.js';import {createCar} from '/game/vehicle-models.js';import {distanceMetres,bearingTo} from '/game/motion.js';
const r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;const s=new T.Scene();s.background=new T.Color('#a9c9d8');s.environment=cityEnvironment();const ambient=new T.HemisphereLight('#e7f4ff','#706955',1.8),sun=new T.DirectionalLight('#ffecd0',3);sun.position.set(-60,100,50);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:1,far:250});sun.shadow.bias=-.0001;s.add(ambient,sun);const model=createSpanner();s.add(model.group);
const plane=(w,d,color,x=0,z=0,y=-.04)=>{const m=new T.Mesh(new T.PlaneGeometry(w,d),new T.MeshStandardMaterial({color}));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;s.add(m);};plane(300,300,'#79816b');plane(47,200,'#a3a39b');plane(41,200,'#363c40',0,0,-.02);plane(2.5,200,'#8a9564',0,0,0);for(const x of [-13,13])for(let z=-85;z<90;z+=8)plane(.12,3.8,'#efe5cf',x,z,.005);
const cars=['taxi','bus','car','truck'].map((kind,i)=>{const c=createCar([0xbe9037,0xd2bd89,0x567586,0x809293][i],kind);c.group.position.set((i%2?1:-1)*(5+Math.floor(i/2)*10),0,20);s.add(c.group);return c});
const camera=new T.PerspectiveCamera(48,1,.08,1000),life=createPrecinctLife(),actors=new Map(),own=createActor('👨🏾','spanner-review'),physics=createBuildingPhysics({queryRenderedFeatures:()=>[],project:()=>({x:0,y:0}),isSourceLoaded:()=>true});physics.refresh(SPANNER.position,true);s.add(own.group);let night=false,walking=false,pos=[...SPANNER_ARRIVAL],height=0,route=[],target=0,heading=0,last=0,viewMode='overview';
function view(mode){viewMode=mode;if(mode==='overview'){camera.position.set(72,42,83);camera.lookAt(0,4,2);}if(mode==='deck'){camera.position.set(21,8.1,-1);camera.lookAt(-26,9,2);}}view('overview');document.getElementById('overview').onclick=()=>view('overview');document.getElementById('deck').onclick=()=>view('deck');
function start(ramp){pos=[...SPANNER_ARRIVAL];height=0;const west=SPANNER_ROUTES[ramp?'westRamp':'westStairs'],a=spannerLocal(west[0]),b=spannerLocal(west[1]),len=Math.hypot(a[0]-b[0],a[1]-b[1]);route=[...SPANNER_ROUTES[ramp?'eastRamp':'eastStairs'],...west.slice().reverse(),spannerPoint(a[0]+(a[0]-b[0])/len*2,a[1]+(a[1]-b[1])/len*2)];target=0;walking=true;viewMode='follow';}document.getElementById('walk').onclick=()=>start(false);document.getElementById('ramp').onclick=()=>start(true);
document.getElementById('night').onclick=()=>{night=!night;s.background.set(night?'#172a43':'#a9c9d8');s.environment=cityEnvironment(night?'night':'day');ambient.intensity=night?.7:1.8;sun.intensity=night?.45:3;};
function frame(ms){const t=ms/1000,dt=Math.min(.04,last?t-last:0);last=t;let moving=false;if(walking){const to=route[target],distance=distanceMetres(pos,to),u=Math.min(1,dt*3.2/Math.max(distance,.001)),next=pos.map((v,i)=>v+(to[i]-v)*u),result=physics.moveWalker(pos,next,height);moving=distanceMetres(pos,result.position)>.001;heading=bearingTo(pos,to);pos=result.position;height=result.elevation;if(distanceMetres(pos,to)<.03){target++;if(target===route.length)walking=false;}document.querySelector('output').textContent=`${walking?'Crossing':'Crossing complete'} · ${height.toFixed(2)} m · ${result.blocked?'blocked':'clear'} · waypoint ${target}/${route.length}`;}
const p=spannerLocal(pos);own.animate(t,moving,{speed:moving?3.2:0});own.group.position.set(p[0],height,p[1]);own.group.rotation.y=-heading*Math.PI/180;if(viewMode==='follow'){const a=heading*Math.PI/180;camera.position.lerp(new T.Vector3(p[0]-Math.sin(a)*8,height+4,p[1]+Math.cos(a)*8),Math.min(1,dt*5));camera.lookAt(p[0],height+1.6,p[1]);}for(const a of actors.values())a.group.visible=false;for(const data of life.tick(t,SPANNER.position,night?0:720)){let a=actors.get(data.id);if(!a){a=createActor(data.avatar,data.id);actors.set(data.id,a);s.add(a.group);}const q=spannerLocal(data.position);a.group.visible=true;a.animate(t,true,{speed:data.speed});a.group.position.set(q[0],data.elevation,q[1]);a.group.rotation.y=-data.heading*Math.PI/180;}
cars.forEach((c,i)=>{c.group.position.z=((t*(8+i*2)+i*30)%150-75)*(i%2?1:-1);c.group.rotation.y=i%2?Math.PI:0;});r.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.render(s,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
