<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worldfolk · Vehicle review</title>
<style>html,body{margin:0;height:100%;background:#afbfcc;color:#123c33;font:15px system-ui}canvas{width:100%;height:100%;display:block}header{position:absolute;left:20px;top:16px;background:#ffffffdc;border-radius:14px;padding:14px}h1{font-size:22px;margin:0}p{margin:6px 0}nav{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;border-radius:15px;background:#fffffff0;flex-wrap:wrap;justify-content:center;width:max-content;max-width:95%}button{border:0;border-radius:8px;padding:11px 14px;background:#e9edea;color:#153e35;cursor:pointer}button[aria-pressed=true]{background:#176a51;color:white}#status{font-size:13px}</style>
<canvas></canvas><header><h1>Worldfolk · Vehicles & materials</h1><p>Taxi · SUV · City bus</p><output id="status">Loading…</output></header><nav><button id="drive">Drive</button><button id="brake">Brake</button><button id="turn">Turn wheels</button><button id="night">Night</button><button id="orbit">Rotate view</button></nav>
<script type="module">
import * as T from '/game/three.module.js';import {createCar,createBus} from '/game/vehicle-models.js';import {cityEnvironment} from '/game/graphics-materials.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color(0xb7cfdb);scene.environment=cityEnvironment();const hemi=new T.HemisphereLight(0xcce4f2,0x656856,1.5);scene.add(hemi);const sun=new T.DirectionalLight(0xffecd1,3);sun.position.set(-10,16,-8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-15,right:15,top:15,bottom:-15});sun.shadow.normalBias=.02;scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x717877,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const vehicles=[createCar(0xece8da,'taxi'),createCar(0x185173,'suv'),createBus()];vehicles.forEach((m,i)=>{m.group.position.set((i-1)*4.3,0,i===2?1.4:0);scene.add(m.group)});
const camera=new T.PerspectiveCamera(42,1,.05,100);let previous=0,drive=false,brake=false,turn=false,night=false,orbit=false,angle=.35;
for(const id of ['drive','brake','turn','night','orbit'])document.getElementById(id).onclick=e=>{if(id==='drive')drive=!drive;if(id==='brake')brake=!brake;if(id==='turn')turn=!turn;if(id==='night'){night=!night;scene.environment=cityEnvironment(night?'night':'day');scene.background.set(night?0x132b3a:0xb7cfdb);hemi.intensity=night?.65:1.5;sun.intensity=night?.65:3;}if(id==='orbit')orbit=!orbit;const state={drive,brake,turn,night,orbit};e.target.setAttribute('aria-pressed',String(state[id]));};
function frame(ms){const dt=Math.min(.05,(ms-previous)/1000);previous=ms;if(orbit)angle+=dt*.2;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();camera.position.set(Math.sin(angle)*17,8,-Math.cos(angle)*17);camera.lookAt(0,.8,0);for(const m of vehicles)m.animateVehicle({distance:drive&&!brake?dt*7:0,steer:turn?.4:0,braking:brake,preset:night?'night':'day'},dt);renderer.render(scene,camera);document.getElementById('status').textContent=`${night?'Night':'Daylight'} · ${drive&&!brake?'Wheels rolling':'Stopped'} · ${brake?'Brake lights on':'Brakes released'}`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
