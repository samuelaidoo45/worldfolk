<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worldfolk · Accra fleet review</title>
<style>html,body{margin:0;height:100%;background:#afbfcc;color:#123c33;font:15px system-ui}canvas{width:100%;height:100%;display:block}header{position:absolute;left:20px;top:16px;background:#ffffffed;border-radius:14px;padding:14px;max-width:80%}h1{font-size:22px;margin:0}p{margin:6px 0}nav{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;border-radius:15px;background:#fffffff0;flex-wrap:wrap;justify-content:center;width:max-content;max-width:94%}button,select{border:0;border-radius:8px;padding:11px 14px;background:#e9edea;color:#153e35;cursor:pointer}button[aria-pressed=true]{background:#176a51;color:white}#status{font-size:13px}@media(max-width:600px){header{font-size:12px;left:10px;top:10px}h1{font-size:17px}nav{bottom:10px}button,select{padding:9px}}</style>
<canvas aria-label="Three-dimensional Accra vehicle models"></canvas><header><h1>Worldfolk · Accra vehicle fleet</h1><p id="names"></p><output id="status">Loading…</output></header><nav><select aria-label="Vehicle family"><option value="commuters">Accra commuters</option><option value="private">Private vehicles</option><option value="commercial">Commercial vehicles</option><option value="cycles">Motorcycles & cycles</option></select><button id="drive">Drive</button><button id="brake">Brake</button><button id="turn">Turn wheels</button><button id="night">Night</button><button id="orbit">Rotate view</button></nav>
<script type="module">
import * as T from '/game/three.module.js';import {createVehicle} from '/game/accra-vehicles.js';import {VEHICLE_MODELS} from '/game/vehicle-catalog.js';import {cityEnvironment} from '/game/graphics-materials.js';import {disposeScene} from '/game/render-utils.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color(0xb7cfdb);scene.environment=cityEnvironment();const hemi=new T.HemisphereLight(0xcce4f2,0x656856,1.5);scene.add(hemi);const sun=new T.DirectionalLight(0xffecd1,3);sun.position.set(-10,16,-8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-17,right:17,top:17,bottom:-17});sun.shadow.normalBias=.02;scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x666d6b,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const groups={commuters:['taxi','minibus','bus'],private:['car','hatchback','suv'],commercial:['pickup','van','truck'],cycles:['bicycle','motorcycle','tricycle']};let vehicles=[],selection='commuters';
function select(key){for(const v of vehicles){scene.remove(v.group);disposeScene(v.group)}selection=key;vehicles=groups[key].map((kind,i)=>{const m=createVehicle(kind,[0x276681,0xbac3c6,0x214e91][i]);m.group.position.set((i-1)*(key==='cycles'?2.5:4.4),0,0);scene.add(m.group);return m});document.getElementById('names').textContent=groups[key].map(id=>VEHICLE_MODELS[id].name).join(' · ')}select(selection);document.querySelector('select').onchange=e=>select(e.target.value);
const camera=new T.PerspectiveCamera(39,1,.05,100);let previous=0,drive=false,brake=false,turn=false,night=false,orbit=false,angle=.48;
for(const id of ['drive','brake','turn','night','orbit'])document.getElementById(id).onclick=e=>{if(id==='drive')drive=!drive;if(id==='brake')brake=!brake;if(id==='turn')turn=!turn;if(id==='night'){night=!night;scene.environment=cityEnvironment(night?'night':'day');scene.background.set(night?0x132b3a:0xb7cfdb);hemi.intensity=night?.65:1.5;sun.intensity=night?.65:3;}if(id==='orbit')orbit=!orbit;e.target.setAttribute('aria-pressed',String({drive,brake,turn,night,orbit}[id]));};
function frame(ms){const dt=Math.min(.05,(ms-previous)/1000);previous=ms;if(orbit)angle+=dt*.25;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();const distance=(selection==='cycles'?10:18)*Math.max(1,1.5/camera.aspect);camera.position.set(Math.sin(angle)*distance,distance*.34,-Math.cos(angle)*distance);camera.lookAt(0,.9,0);for(const m of vehicles)m.animateVehicle({distance:drive&&!brake?dt*5:0,steer:turn?.4:0,braking:brake,preset:night?'night':'day'},dt);renderer.render(scene,camera);document.getElementById('status').textContent=`${night?'Night':'Daylight'} · ${drive&&!brake?'Wheels rolling':'Stopped'} · ${brake?'Brake lights on':'Brakes released'} · ${renderer.info.render.calls} draws · ${Math.round(renderer.info.render.triangles/1000)}k triangles`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
