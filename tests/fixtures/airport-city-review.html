<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airport City review</title><style>body{margin:0;font:14px system-ui;background:#adc2c7}canvas{display:block;width:100vw;height:100vh}header,nav{position:fixed;left:12px;padding:12px;background:#163b35ef;color:white;border-radius:10px;z-index:2;max-width:90%}header{top:12px}nav{bottom:12px;display:flex;gap:6px;flex-wrap:wrap}h1{font-size:18px;margin:0}button{border:0;border-radius:7px;padding:10px;cursor:pointer}</style><canvas></canvas><header><h1>Airport City</h1><output>Native outlines · photo-estimated architecture</output></header><nav><button id="marina">Marina Mall</button><button id="square">One Airport Square</button><button id="supermarket">Supermarket</button><button id="retail">Shopping gallery</button><button id="food">Food court</button></nav><script type="module">
import * as T from '/public/game/three.module.js';import {createAirportCitySite} from '/public/game/airport-city.js';import {AIRPORT_CITY_SITES,cityLocal} from '/public/game/airport-city-data.js';import {buildMarinaInterior} from '/public/game/marina-interior-model.js';import {cityEnvironment} from '/public/game/graphics-materials.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color('#adc2c7');scene.environment=cityEnvironment();const hemi=new T.HemisphereLight('#e3f1fa','#87745d',1.8),sun=new T.DirectionalLight('#ffead0',3);sun.position.set(-60,95,65);scene.add(hemi,sun);const camera=new T.PerspectiveCamera(48,1,.1,1000);const ground=new T.Mesh(new T.PlaneGeometry(800,800),new T.MeshStandardMaterial({color:'#898675',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);let model;
function show(id){if(model)scene.remove(model);ground.visible=['marina','square'].includes(id);if(ground.visible){const s=AIRPORT_CITY_SITES.find(s=>s.family===id);model=createAirportCitySite(s).group;camera.position.set(id==='marina'?95:90,id==='marina'?34:50,id==='marina'?65:-82);camera.lookAt(0,id==='marina'?17:15,id==='marina'?-6:0);}else{model=buildMarinaInterior(id).group;camera.position.set(id==='food'?9:0,2.6,id==='food'?13:18);camera.lookAt(id==='food'?0:0,1.7,id==='food'?0:-10);}scene.add(model);document.querySelector('h1').textContent={marina:'Marina Mall',square:'One Airport Square',supermarket:'Marina Mall · supermarket',retail:'Marina Mall · shopping gallery',food:'Marina Mall · food court'}[id];}
for(const id of ['marina','square','supermarket','retail','food'])document.getElementById(id).onclick=()=>show(id);show('marina');function frame(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
</script>
